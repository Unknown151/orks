<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12160f">
<title>Ork Army Builder</title>
<style>
:root{
  --bg:#12160f; --bg2:#1a2015; --card:#1f2618; --card2:#263021; --line:#3a4630;
  --txt:#e8eede; --dim:#9aa88a; --accent:#7fb43f; --accent2:#4a7c2f;
  --warn:#c2922b; --bad:#9e2f2f; --good:#3a7d44;
  --radius:10px;
}
html[data-theme="light"]{
  --bg:#eceee6; --bg2:#e2e6d8; --card:#fbfcf8; --card2:#f0f2ea; --line:#c5cdb4;
  --txt:#1c2116; --dim:#5d6a4c; --accent:#4a7c2f; --accent2:#3a6023;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%; padding-bottom:env(safe-area-inset-bottom);
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--line)}
.hd-top{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.hd-title{font-weight:700;letter-spacing:.5px;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-title span{color:var(--accent)}
.hd-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;white-space:nowrap}
.hd-btn:disabled{opacity:.4}
.hd-btn.on{background:var(--accent2);border-color:var(--accent)}
.ver{padding:0 10px 6px;font-size:11px;color:var(--dim)}
nav{display:flex;gap:2px;padding:0 6px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:1;min-width:78px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:7px 4px;font-size:13px;font-weight:600}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}

main{padding:10px;max-width:900px;margin:0 auto;padding-bottom:calc(var(--dock-h, 84px) + 14px)}
.view{display:none}
.view.on{display:block}

/* ---------- generic bits ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--card2);cursor:pointer;user-select:none}
.panel-hd h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);flex:1}
.panel-hd .sum{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%;text-align:right}
.panel-hd .chev{color:var(--dim);font-size:11px}
.panel-bd{padding:11px;display:none}
.panel.open .panel-bd{display:block}
.muted{color:var(--dim)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:22px 12px;line-height:1.6}
.empty code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.pill.tap{cursor:pointer}
.pill.tap:active{background:var(--accent2)}
.pill.core{border-color:var(--accent2);color:var(--accent)}
.pill.inh{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.pill.kw{font-size:10.5px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase}
.pill.grant{border-color:var(--good);color:var(--good)}
.pill.fac{border-color:var(--warn);color:var(--warn)}
.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:1px 6px;border-radius:4px;background:var(--accent2);color:#fff}
.tag.up{background:var(--warn);color:#241c00}
.sel{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px}
.btn.pri{background:var(--accent2);border-color:var(--accent)}
.btn.danger{border-color:var(--bad);color:#e88}
.btn:disabled{opacity:.4}
.mini{font-size:12px;padding:3px 8px}

/* ---------- unit card ---------- */
.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.unit-hd{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;background:var(--card2);
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.unit-hd:active{background:var(--line)}
.ucv{color:var(--accent);font-size:21px;line-height:.9;display:inline-block;flex:none;
  transform:rotate(90deg);transition:transform .2s ease}
.unit.collapsed .ucv{transform:rotate(0deg)}
.unit.collapsed{margin-bottom:7px}
.unit.collapsed .unit-hd{border-bottom:0}
.unit.collapsed .unit-bd,.unit.collapsed .leader-band{display:none}
@media (prefers-reduced-motion: reduce){ .ucv{transition:none} }
.unit-hd h3{margin:0;font-size:15px;flex:1;line-height:1.25}
.unit-hd .sub{display:block;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:2px}
.pts{font-weight:700;color:var(--accent);white-space:nowrap;font-size:14px}
.esc{color:var(--warn);cursor:help}
.unit-bd{padding:10px 11px}
.sec{margin-top:11px}
.sec:first-child{margin-top:0}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin-bottom:5px;border-bottom:1px solid var(--line);padding-bottom:3px}
.statline{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.stat{flex:1;min-width:44px;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:3px 2px}
.stat b{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.5px}
.stat.mod{border-color:var(--warn)}
.stat.mod span{color:var(--warn)}
.stat span{font-size:14px;font-weight:700}
.prof-n{font-size:11.5px;color:var(--dim);margin:7px 0 3px}
.inv{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12.5px}
.inv b{color:var(--accent)}
.wtbl{width:100%;border-collapse:collapse;font-size:12px}
.wtbl th{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;text-align:center;padding:2px 1px;font-weight:600}
.wtbl th:first-child{text-align:left}
.wtbl td{padding:3px 1px;text-align:center;border-top:1px solid var(--line)}
.wtbl td:first-child{text-align:left;line-height:1.3}
.wtbl .wn{font-weight:600}
.wgrp{font-size:10.5px;color:var(--warn);padding:4px 0 1px;font-style:italic}
.wab{margin-top:2px}
.split-note{font-size:11px;color:var(--dim);font-style:italic;margin-top:4px}
.leader-band{background:var(--accent2);color:#fff;font-size:10px;letter-spacing:.7px;text-transform:uppercase;padding:3px 11px;font-weight:700}
.merged-sec{border-top:2px solid var(--accent2)}

/* ---------- builder ---------- */
.bnum{display:flex;align-items:center;gap:6px}
.bnum button{width:28px;height:28px;border-radius:7px;background:var(--card2);border:1px solid var(--line);font-size:16px;line-height:1;padding:0}
.bnum span{min-width:46px;text-align:center;font-size:13px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.ctl label{font-size:11.5px;color:var(--dim);min-width:74px}
.star{color:var(--warn)}
.totals{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.totals .big{font-size:22px;font-weight:800;color:var(--accent)}
.totals .big.over{color:var(--bad)}

/* ---------- detachment cards ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dcard{background:var(--card2);border:1px solid var(--line);border-radius:9px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.dcard .bar{height:4px;background:var(--dim)}
.dcard .in{padding:7px 9px}
.dcard .n{font-size:13px;font-weight:600;line-height:1.25}
.dcard .m{font-size:11px;color:var(--dim);margin-top:3px}
.dcard.on{border-color:var(--accent);background:var(--accent2)}
.dcard.on .m{color:#dfeacd}
.dcard.blocked{opacity:.38}
.dp{font-weight:700}
.dp.over{color:var(--bad)}

/* ---------- enhancement overview ---------- */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ecard{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 9px;text-align:left;cursor:pointer}
.ecard .n{font-size:13px;font-weight:600}
.ecard .p{font-size:11px;color:var(--accent);font-weight:700}
.ecard .g{font-size:10.5px;color:var(--dim);margin-top:3px}
.ecard .s{font-size:11.5px;margin-top:4px;color:var(--dim)}
.egroup{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:10px 0 5px}
.egroup:first-child{margin-top:0}

/* ---------- stratagems ---------- */
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;white-space:nowrap}
.chip.on{background:var(--accent2);border-color:var(--accent)}
.strat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.strat-hd{display:flex;gap:8px;align-items:flex-start;padding:8px 11px;background:var(--card2)}
.strat-hd .n{flex:1;font-weight:600;font-size:14px}
.strat-hd .n small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:2px}
.cp{background:var(--accent2);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700;white-space:nowrap}
.strat-bd{padding:9px 11px;font-size:13px}
.strat-bd p{margin:0 0 6px}
.strat-bd b{color:var(--accent)}

/* ---------- points tab ---------- */
.track{display:flex;align-items:center;gap:10px;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:9px}
.track .lbl{flex:1}
.track .lbl b{display:block;font-size:14px}
.track .lbl small{color:var(--dim);font-size:11px}
.track .val{font-size:26px;font-weight:800;min-width:52px;text-align:center;color:var(--accent)}
.track button{width:38px;height:38px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:20px;line-height:1;padding:0}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:85vh;overflow:auto;padding:14px 15px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){#modal{align-items:center}.mbox{border-radius:14px}}
.mbox h3{margin:0;font-size:17px}
.mbox .mtype{font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin:3px 0 9px}
.mbox .mbody{font-size:14px;line-height:1.55}
.mbox .mbody p{margin:0 0 8px}
.mclose{margin-top:14px;width:100%;padding:10px;border-radius:9px;background:var(--card2);border:1px solid var(--line)}
.mwarn{margin-top:10px;font-size:11.5px;color:var(--warn);border-top:1px solid var(--line);padding-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);border-radius:9px;padding:9px 15px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
textarea.exp{width:100%;height:230px;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.err{background:#3a1a1a;border:1px solid var(--bad);border-radius:9px;padding:11px;font-size:13px;margin-bottom:10px}

/* ---------- faction call dock (always on screen) ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;align-items:center;
  gap:7px;padding:0 10px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
#dockBanner{pointer-events:auto;width:100%;max-width:560px;background:var(--card);border:1px solid var(--accent);
  border-left:4px solid var(--accent);border-radius:11px;padding:9px 11px;font-size:12.5px;line-height:1.45;
  box-shadow:0 8px 26px rgba(0,0,0,.5);display:none}
#dockBanner.on{display:block;animation:dbIn .28s ease-out}
@keyframes dbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#dockBanner .hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#dockBanner .hd b{color:var(--accent);letter-spacing:.6px;font-size:12px;flex:1}
#dockBanner .dur{font-size:11px;color:var(--dim);display:block;margin-top:4px}
#dockEnd{background:transparent;border:1px solid var(--line);border-radius:7px;padding:2px 9px;font-size:11px;color:var(--dim)}
#dockBtn{pointer-events:auto;position:relative;border:0;border-radius:99px;padding:12px 30px;
  font-weight:900;letter-spacing:1.2px;font-size:17px;color:#0d1408;
  background:linear-gradient(180deg,#a5dc57 0%,#5e9a2c 100%);
  box-shadow:0 6px 20px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.35);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
#dockBtn:active{transform:translateY(2px)}
#dockBtn.on{background:linear-gradient(180deg,#ffd257 0%,#c2922b 100%);color:#2a1f00}
#dockBtn::after{content:'';position:absolute;inset:0;border-radius:99px;border:3px solid var(--accent);opacity:0;pointer-events:none}
#dockBtn.fire{animation:dShake .55s ease-in-out}
#dockBtn.fire::after{animation:dRing .6s ease-out}
@keyframes dShake{0%,100%{transform:none}12%{transform:translateX(-6px) scale(1.09) rotate(-2deg)}
  28%{transform:translateX(6px) scale(1.11) rotate(2deg)}44%{transform:translateX(-5px) scale(1.07) rotate(-1.5deg)}
  62%{transform:translateX(4px) scale(1.04) rotate(1deg)}82%{transform:translateX(-2px) scale(1.02)}}
@keyframes dRing{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(2.5)}}
#dockFlash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 108%, rgba(165,220,87,.7) 0%, rgba(127,180,63,.32) 32%, transparent 62%)}
#dockFlash.on{animation:dFlash .75s ease-out}
@keyframes dFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  #dockBtn.fire,#dockBtn.fire::after,#dockFlash.on,#dockBanner.on{animation:none}
}
</style>
</head>
<body>

<header>
  <div class="hd-top">
    <div class="hd-title">WAAAGH! <span>Army Builder</span></div>
    <button class="hd-btn" id="btnDp" title="Detachment Points">DP <span id="dpChip">0/3</span></button>
    <button class="hd-btn" id="btnMenu" title="Lists &amp; sharing">☰</button>
    <button class="hd-btn" id="btnTheme" title="Toggle theme">◐</button>
  </div>
  <div class="ver" id="verLine"></div>
  <nav>
    <button data-tab="army">Army</button>
    <button data-tab="builder" class="on">Builder</button>
    <button data-tab="strats">Stratagems</button>
    <button data-tab="cp">Combat Patrol</button>
  </nav>
</header>

<main>
  <div id="loadErr"></div>
  <section class="view" id="view-army"></section>
  <section class="view on" id="view-builder"></section>
  <section class="view" id="view-strats"></section>
  <section class="view" id="view-cp"></section>
  <section class="view" id="view-points"></section>
</main>

<div id="dockFlash"></div>
<div id="dock">
  <div id="dockBanner"></div>
  <button id="dockBtn"></button>
</div>

<div id="modal"><div class="mbox">
  <h3 id="mTitle"></h3>
  <div class="mtype" id="mType"></div>
  <div class="mbody" id="mBody"></div>
  <button class="mclose" id="mClose">Close</button>
</div></div>
<div id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   Ork Army Builder — Warhammer 40,000 11th edition
   Built to NEW_ARMY_BUILD_GUIDE.md + DETACHMENT_POINTS_SPEC.md.
   All rules content lives in data/*.json — never hard-code a rule here.
   ========================================================================== */

const EDITION = '11th Edition';
const VERSION = '0.6.0';

// Army-wide cap on enhancements/upgrades. VERIFY against the current edition —
// this number has changed between editions (guide §5.3).
const MAX_ENHANCEMENTS = 3;
const MAX_UPGRADE_COPIES = 3;

const LS = {
  army:'orks.army', dets:'orks.detachments', lists:'orks.lists', game:'orks.game',
  theme:'orks.theme', limit:'orks.limit', name:'orks.listName', legacyDet:'orks.detachment',
  collapsed:'orks.collapsed', cpChoice:'orks.cpChoice'
};

/* ---------------------------------- data --------------------------------- */
const DATA = {
  abilities:{}, enhancements:{}, stratagems:{},
  detachments:{}, detCategories:{}, dpBudget:3,
  units:{}, unitOrder:[],
  // Combat Patrol is a separate game mode with its own fixed force, its own
  // datasheets and its own stratagems — kept in its own namespace so it can
  // never mix with matched-play data.
  combatPatrol:null, cpUnits:{}
};

/* --------------------------------- state --------------------------------- */
let armyList = [];              // instances, in list order
let selectedDetachments = [];   // ARRAY of detachment ids (DP spec §2)
let pointsLimit = 2000;
let listName = 'Untitled list';
let game = { cp:0, round:1, vpUs:0, vpThem:0, waaagh:false };
let ui = { tab:'builder', detOpen:true, enhOpen:false, stratPhase:'all', stratTurn:'all',
  // Force choices default open — it is the one panel you set before a game.
  panels:{ cpChoice:true } };
// Which unit cards are collapsed, keyed by a stable per-card id. Persisted so a
// tidied-up list stays tidy across a reload mid-game.
let collapsed = {};
// Combat Patrol force choices: which enhancement is active, and which leader is
// attached to which roster entry. Both are per-game picks, so they persist.
let cpChoice = { enh:null, leader:null, target:null };

/* -------------------------------- helpers -------------------------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const isMeta = k => k.charAt(0) === '_';

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}

function openModal(title, type, body, warn){
  $('#mTitle').textContent = title;
  $('#mType').textContent = type || '';
  $('#mBody').innerHTML = body + (warn ? `<div class="mwarn">⚠ ${esc(warn)}</div>` : '');
  $('#modal').classList.add('on');
}
$('#mClose').onclick = () => $('#modal').classList.remove('on');
$('#modal').onclick = e => { if(e.target.id==='modal') $('#modal').classList.remove('on'); };

/* ============================== DATA LOADING ============================== */
async function getJSON(path){
  const r = await fetch(path + '?v=' + VERSION, {cache:'no-cache'});
  if(!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
}
function stripMeta(obj){
  const out = {};
  for(const k of Object.keys(obj||{})) if(!isMeta(k)) out[k] = obj[k];
  return out;
}

async function loadData(){
  const [ab, enh, str, det, manifest] = await Promise.all([
    getJSON('data/abilities.json'),
    getJSON('data/enhancements.json'),
    getJSON('data/stratagems.json'),
    getJSON('data/detachments.json'),
    getJSON('data/units/index.json')
  ]);
  DATA.abilities    = stripMeta(ab);
  DATA.enhancements = stripMeta(enh);
  DATA.stratagems   = stripMeta(str);
  DATA.detCategories= det.categories || {};
  DATA.dpBudget     = det.budget ?? 3;
  DATA.detachments  = stripMeta(det.detachments || {});
  for(const [id,d] of Object.entries(DATA.detachments)) d.id = id;

  const ids = (manifest.units || []).filter(x => typeof x === 'string' && !isMeta(x));
  const units = await Promise.all(ids.map(async id => {
    try { return await getJSON('data/units/' + id + '.json'); }
    catch(e){ console.warn('unit failed:', id, e); return null; }
  }));
  units.forEach((u,i) => {
    if(!u) return;
    if(u.id !== ids[i]) console.warn(`unit id "${u.id}" != filename "${ids[i]}"`);
    DATA.units[u.id] = u;
    DATA.unitOrder.push(u.id);
  });
  DATA.unitOrder.sort((a,b)=> (DATA.units[a].name||'').localeCompare(DATA.units[b].name||''));

  await loadCombatPatrol();
}

// Combat Patrol is optional: a missing file just leaves the tab empty rather
// than failing the whole app.
async function loadCombatPatrol(){
  let cp;
  try { cp = await getJSON('data/combat-patrol/index.json'); }
  catch { return; }
  DATA.combatPatrol = stripMeta(cp);
  DATA.combatPatrol.stratagems = stripMeta(cp.stratagems || {});
  // The datasheet manifest is the roster unless one is given explicitly.
  const ids = Array.isArray(cp.units) && cp.units.length
    ? cp.units.filter(x => typeof x === 'string' && !isMeta(x))
    : [...new Set(cpRosterEntries().flatMap(e => [e.unit, e.ledBy]).filter(Boolean))];
  const loaded = await Promise.all(ids.map(async id => {
    try { return await getJSON('data/combat-patrol/units/' + id + '.json'); }
    catch(e){ console.warn('combat patrol unit failed:', id, e); return null; }
  }));
  loaded.forEach((u,i) => {
    if(!u) return;
    if(u.id !== ids[i]) console.warn(`combat patrol unit id "${u.id}" != filename "${ids[i]}"`);
    DATA.cpUnits[u.id] = u;
  });
}
// Discard stored choices that this force does not offer (data edited since).
function validateCpChoice(){
  const cp = DATA.combatPatrol;
  if(!cp?.enhancements?.[cpChoice.enh]) cpChoice.enh = null;
  if(!(cp?.leaderChoice?.leaders || []).includes(cpChoice.leader)){ cpChoice.leader = null; cpChoice.target = null; }
  if(cpChoice.leader && !cpLeaderTargets(cpChoice.leader).some(e => e.idx === cpChoice.target)) cpChoice.target = null;
}
// Roster entries are either a plain unit id or {unit, count, ledBy}.
function cpRosterEntries(){
  return (DATA.combatPatrol?.roster || []).map(r =>
    typeof r === 'string' ? { unit:r, count:1 } : { count:1, ...r });
}

/* ============================ DETACHMENT POINTS =========================== */
/* DETACHMENT_POINTS_SPEC.md §3 */
const isDetachmentActive = id => selectedDetachments.includes(id);
const dpSpent = () => selectedDetachments.reduce((s,id)=> s + (DATA.detachments[id]?.dp || 0), 0);
const dpRemaining = () => DATA.dpBudget - dpSpent();

function uniqueGroupTaken(group, exceptId){
  if(!group) return false;
  return selectedDetachments.some(id => id !== exceptId && DATA.detachments[id]?.unique === group);
}
function canAddDetachment(id){
  const d = DATA.detachments[id];
  if(!d || isDetachmentActive(id)) return false;
  if((d.dp||0) > dpRemaining()) return false;
  if(uniqueGroupTaken(d.unique)) return false;
  return true;
}
function toggleDetachment(id){
  const d = DATA.detachments[id];
  if(!d) return;
  if(isDetachmentActive(id)){
    selectedDetachments = selectedDetachments.filter(x => x !== id);
    clearOrphanedEnhancements();
  } else {
    if((d.dp||0) > dpRemaining()){
      toast(`Not enough DP — ${d.name} costs ${d.dp}, ${dpRemaining()} left.`); return;
    }
    if(uniqueGroupTaken(d.unique)){
      toast(`${d.name} can't be combined with another selected detachment.`); return;
    }
    selectedDetachments.push(id);
  }
  save(); renderAll();
}
// Content is available if it has no detachment requirement, or one of its
// detachment(s) is active. Accepts a string OR an array (spec §7.2).
function isContentDetachmentActive(item){
  if(!item) return false;
  if(!item.detachment) return true;
  const dets = Array.isArray(item.detachment) ? item.detachment : [item.detachment];
  return dets.some(isDetachmentActive);
}
function clearOrphanedEnhancements(){
  armyList.forEach(inst => {
    if(inst.enhancementId && !isContentDetachmentActive(DATA.enhancements[inst.enhancementId]))
      inst.enhancementId = null;
  });
}
function showDetachmentRules(){
  const active = selectedDetachments.map(id => DATA.detachments[id]).filter(Boolean);
  const body = active.length
    ? active.map(d => `<p><strong>${esc(d.name)}</strong> <span class="muted">(${d.dp} DP · ${esc(d.category||'—')})</span><br>${d.ruleDescription || '<em>Rule to be added.</em>'}</p>`).join('')
    : '<p class="muted">No detachments selected. Pick them on the Builder tab.</p>';
  openModal('Detachment Rules', `${dpSpent()} / ${DATA.dpBudget} DP used`, body);
}
// A detachment rule that grants an ability to keyword-matched units (guide §5.8).
// Table-driven: put `grants:[{keyword,abilityId}]` on the detachment in data.
function getDetachmentGrantedAbilities(unit){
  const out = [];
  selectedDetachments.forEach(id => {
    const d = DATA.detachments[id];
    (d?.grants || []).forEach(g => {
      if(g.keyword && !(unit.keywords||[]).includes(g.keyword)) return;
      out.push({ id:g.abilityId, name: DATA.abilities[g.abilityId]?.name || g.abilityId, from:d.name });
    });
  });
  return out;
}

/* ================================ COSTING ================================ */
/* guide §5.1 */
function unitCopyIndex(inst){
  let n = 0;
  for(const i of armyList){ if(i.unitId === inst.unitId){ n++; if(i.uid === inst.uid) return n; } }
  return 1;
}
function sizeOptions(unit){
  const t = unit.costing?.tiers?.[0];
  if(t && t.length) return t.map(e => e.models);
  return [unit.models ?? 1];
}
function tierFor(unit, copyIndex){
  const c = unit.costing;
  if(!c?.tiers?.length) return null;
  const after = c.escalationAfter ?? Infinity;
  if(copyIndex <= after) return c.tiers[0];
  return c.tiers[Math.min(copyIndex - after, c.tiers.length - 1)];
}
function priceFor(unit, models, copyIndex){
  const tier = tierFor(unit, copyIndex);
  if(!tier) return unit.points || 0;
  const exact = tier.find(e => e.models === models);
  if(exact) return exact.points;
  let best = tier[0];
  for(const e of tier) if(e.models <= models) best = e;
  return (best || tier[0]).points;
}
function isEscalated(unit, copyIndex){
  const c = unit.costing;
  return !!(c && c.escalationAfter != null && c.tiers?.length > 1 && copyIndex > c.escalationAfter);
}
function instancePoints(inst){
  const u = DATA.units[inst.unitId];
  if(!u) return 0;
  let p = priceFor(u, inst.models, unitCopyIndex(inst));
  const e = inst.enhancementId && DATA.enhancements[inst.enhancementId];
  if(e) p += e.points || 0;
  return p;
}
const armyPoints = () => armyList.reduce((s,i) => s + instancePoints(i), 0);

/* ========================= ENHANCEMENTS & UPGRADES ======================== */
/* guide §5.3 */
function getEnhancementUsage(excludeUid){
  const m = {};
  armyList.forEach(i => {
    if(i.uid === excludeUid || !i.enhancementId) return;
    m[i.enhancementId] = (m[i.enhancementId] || 0) + 1;
  });
  return m;
}
// Cap count: every Enhancement counts; only the FIRST copy of each distinct Upgrade counts.
function countArmyEnhancements(excludeUid, extraId){
  const usage = getEnhancementUsage(excludeUid);
  if(extraId) usage[extraId] = (usage[extraId] || 0) + 1;
  let n = 0;
  for(const [id,c] of Object.entries(usage)){
    const e = DATA.enhancements[id];
    if(!e) continue;
    n += e.upgrade ? 1 : c;
  }
  return n;
}
function eligibleEnhancements(inst){
  const u = DATA.units[inst.unitId];
  if(!u || u.isEpicHero) return [];                       // Epic Heroes take neither
  const isChar = (u.keywords||[]).includes('CHARACTER') || (u.type||[]).includes('Character');
  const names = allWeaponNames(u);
  return Object.entries(DATA.enhancements).filter(([id,e]) => {
    if(!isContentDetachmentActive(e)) return false;
    if(!e.upgrade && !isChar) return false;               // Enhancements: CHARACTER only
    if(e.restrictedTo && !e.restrictedTo.includes(u.id)) return false;
    if(e.restrictedToKeyword && !(u.keywords||[]).includes(e.restrictedToKeyword)) return false;
    if(e.restrictedToWeapon && !names.includes(e.restrictedToWeapon)) return false;
    return true;
  }).map(([id,e]) => ({ id, ...e }));
}
// Why this enhancement can't be picked for this instance — or null if it can.
function enhancementBlockReason(id, inst){
  const e = DATA.enhancements[id];
  if(!e) return 'Unknown';
  const used = getEnhancementUsage(inst.uid)[id] || 0;
  if(e.upgrade){ if(used >= MAX_UPGRADE_COPIES) return `max ${MAX_UPGRADE_COPIES}`; }
  else if(used >= 1) return 'taken';
  if(countArmyEnhancements(inst.uid, id) > MAX_ENHANCEMENTS) return 'cap';
  return null;
}

/* ================================ WEAPONS ================================ */
const weaponCount = (inst, w) => inst?.weaponCounts?.[w.name] ?? (w.count ?? 1);  // ?? not || (guide §9)
// Units live in two namespaces (matched play / Combat Patrol); look in both.
const lookupUnit = id => DATA.units[id] || DATA.cpUnits[id] || null;

function allWeaponNames(unit){
  return ['ranged','melee'].flatMap(k => (unit.weapons?.[k] || []).map(w => w.name));
}
// Strip the profile suffix from a multi-profile weapon name: "Big Shoota – Focused" → "Big Shoota"
function baseWeaponName(n){
  return String(n).split(/\s+[–—-]\s+/)[0].replace(/\s*\([^)]*\)\s*$/,'').trim();
}
// ONE summariser, used by every summary path (guide §5.7).
function summarizeWeaponEntries(unit, inst){
  const out = [], seen = {};
  ['ranged','melee'].forEach(k => (unit.weapons?.[k] || []).forEach(w => {
    const c = weaponCount(inst, w);
    if(!c) return;
    const key = w.weaponGroup || w.name;
    if(seen[key] != null){ out[seen[key]].count = Math.max(out[seen[key]].count, c); return; }
    seen[key] = out.length;
    out.push({ name: w.weaponGroup ? baseWeaponName(w.name) : w.name, count: c });
  }));
  return out;
}
const weaponSummaryText = (unit, inst) =>
  summarizeWeaponEntries(unit, inst).map(w => (w.count > 1 ? w.count + '× ' : '') + w.name).join(', ');

/* ================================ LEADERS ================================ */
/* guide §5.4 — leaders keep their abilities when the bodyguard dies (11th ed) */
const leaderInstOf = inst => armyList.find(x => x.uid === inst.leaderId) || null;
const isAttachedLeader = inst => armyList.some(x => x.leaderId === inst.uid);
function canLeadPair(leaderUnit, unit){
  return (leaderUnit.canLead || []).includes(unit.id) || (unit.canBeLeadBy || []).includes(leaderUnit.id);
}
function availableLeadersFor(inst){
  const u = DATA.units[inst.unitId];
  if(!u || u.isLeader) return [];
  return armyList.filter(l => {
    const lu = DATA.units[l.unitId];
    if(!lu?.isLeader) return false;
    if(armyList.some(x => x.leaderId === l.uid && x.uid !== inst.uid)) return false;   // already attached
    return canLeadPair(lu, u);
  });
}
// Abilities a leader injects into its unit's weapon rows, as inherited badges.
function inheritedAbilitiesFor(inst, weaponKind){
  if(!inst) return [];
  const l = leaderInstOf(inst);
  const b = l && DATA.units[l.unitId]?.leaderBonus;
  if(!b?.grantsAbilities?.length) return [];
  if(b.appliesTo && b.appliesTo !== weaponKind) return [];
  return b.grantsAbilities;
}

/* =============================== INSTANCES =============================== */
function makeInstance(unitId){
  const u = DATA.units[unitId];
  return {
    uid: uid(), unitId,
    models: u ? (sizeOptions(u)[0] ?? u.models ?? 1) : 1,
    leaderId: null, enhancementId: null,
    wargear: {},        // wargearChoices id -> bool
    exclusive: null,    // wargearExclusiveChoices pick
    weaponCounts: {},   // weapon name -> count override
    slots: {}           // guided-wargear decisions (guide §5.5c)
  };
}
function addUnit(unitId){
  if(!DATA.units[unitId]) return;
  armyList.push(makeInstance(unitId));
  save(); renderAll();
}
function removeInstance(uidToRemove){
  armyList.forEach(i => { if(i.leaderId === uidToRemove) i.leaderId = null; });
  armyList = armyList.filter(i => i.uid !== uidToRemove);
  save(); renderAll();
}
function duplicateInstance(u){
  const src = armyList.find(i => i.uid === u);
  if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.uid = uid();
  copy.leaderId = null;                    // a leader can only lead one unit
  const enh = copy.enhancementId && DATA.enhancements[copy.enhancementId];
  if(enh && enhancementBlockReason(copy.enhancementId, copy)) copy.enhancementId = null;
  armyList.splice(armyList.indexOf(src) + 1, 0, copy);
  save(); renderAll();
}

/* ============================== PERSISTENCE ============================== */
/* guide §7 — localStorage, saved slots, share URL and text export must all
   stay in sync whenever an instance field is added. */
function save(){
  try{
    localStorage.setItem(LS.army, JSON.stringify(armyList));
    localStorage.setItem(LS.dets, JSON.stringify(selectedDetachments));
    localStorage.setItem(LS.game, JSON.stringify(game));
    localStorage.setItem(LS.limit, String(pointsLimit));
    localStorage.setItem(LS.name, listName);
    localStorage.setItem(LS.cpChoice, JSON.stringify(cpChoice));
  }catch(e){ console.warn('save failed', e); }
}
function loadState(){
  try{
    const a = JSON.parse(localStorage.getItem(LS.army) || '[]');
    if(Array.isArray(a)) armyList = a.filter(i => DATA.units[i.unitId]).map(normalizeInstance);
  }catch{}
  // detachments: array, migrating the legacy single-string key (spec §5)
  try{
    const arr = JSON.parse(localStorage.getItem(LS.dets));
    if(Array.isArray(arr)) selectedDetachments = arr.filter(id => DATA.detachments[id]);
    else throw 0;
  }catch{
    const old = localStorage.getItem(LS.legacyDet);
    selectedDetachments = (old && DATA.detachments[old]) ? [old] : [];
  }
  try{ const g = JSON.parse(localStorage.getItem(LS.game)); if(g) game = {...game, ...g}; }catch{}
  const lim = parseInt(localStorage.getItem(LS.limit), 10);
  if(!isNaN(lim)) pointsLimit = lim;
  listName = localStorage.getItem(LS.name) || listName;
  try{ const c = JSON.parse(localStorage.getItem(LS.collapsed)); if(c && typeof c === 'object') collapsed = c; }catch{}
  try{ const c = JSON.parse(localStorage.getItem(LS.cpChoice)); if(c && typeof c === 'object') cpChoice = {...cpChoice, ...c}; }catch{}
  const th = localStorage.getItem(LS.theme);
  if(th) document.documentElement.setAttribute('data-theme', th);
}
// Accept older/partial instance shapes on load (guide §7).
function normalizeInstance(i){
  const u = DATA.units[i.unitId];
  return {
    uid: i.uid || uid(), unitId: i.unitId,
    models: i.models ?? (u ? sizeOptions(u)[0] : 1),
    leaderId: i.leaderId ?? null,
    enhancementId: i.enhancementId ?? null,
    wargear: i.wargear || {},
    exclusive: i.exclusive ?? null,
    weaponCounts: i.weaponCounts || {},
    slots: i.slots || {}
  };
}

/* ---- saved list slots ---- */
const getLists = () => { try{ return JSON.parse(localStorage.getItem(LS.lists) || '[]'); }catch{ return []; } };
const putLists = l => localStorage.setItem(LS.lists, JSON.stringify(l));
function saveListSlot(name){

function loadListSlot(name){

/* ---- share URL: pack → deflate → base64url in the hash ---- */
function packList(){
  const idx = {}; armyList.forEach((i,n) => idx[i.uid] = n);
  return {
    v:1, n:listName, l:pointsLimit, d:selectedDetachments,
    a: armyList.map(i => {
      const o = { u:i.unitId, m:i.models };
      if(i.leaderId != null && idx[i.leaderId] != null) o.L = idx[i.leaderId];
      if(i.enhancementId) o.e = i.enhancementId;
      if(Object.keys(i.wargear||{}).length) o.w = i.wargear;
      if(i.exclusive) o.x = i.exclusive;
      if(Object.keys(i.weaponCounts||{}).length) o.c = i.weaponCounts;
      if(Object.keys(i.slots||{}).length) o.s = i.slots;
      return o;
    })
  };
}
function unpackList(p){
  if(!p || !Array.isArray(p.a)) return false;
  listName = p.n || listName;
  if(p.l) pointsLimit = p.l;
  selectedDetachments = Array.isArray(p.d) ? p.d.filter(id => DATA.detachments[id])
                      : (DATA.detachments[p.d] ? [p.d] : []);      // legacy single string
  armyList = p.a.filter(o => DATA.units[o.u]).map(o => ({
    uid: uid(), unitId:o.u, models:o.m, leaderId:null,
    enhancementId:o.e || null, wargear:o.w || {}, exclusive:o.x || null,
    weaponCounts:o.c || {}, slots:o.s || {}
  }));
  p.a.forEach((o,n) => { if(o.L != null && armyList[n] && armyList[o.L]) armyList[n].leaderId = armyList[o.L].uid; });
  clearOrphanedEnhancements();
  return true;
}
const b64u  = b => btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u= s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));

async function encodeShare(){
  const json = JSON.stringify(packList());
  if(window.CompressionStream){
    try{
      const cs = new CompressionStream('deflate-raw');
      const w = cs.writable.getWriter();
      w.write(new TextEncoder().encode(json)); w.close();
      return 'z' + b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
    }catch(e){ /* fall through */ }
  }
  return 'p' + b64u(new TextEncoder().encode(json));
}
async function decodeShare(str){
  const mode = str[0], body = unb64u(str.slice(1));
  if(mode === 'z'){
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter(); w.write(body); w.close();
    return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
  }
  return JSON.parse(new TextDecoder().decode(body));
}
async function shareLink(){
  const code = await encodeShare();
  const url = location.origin + location.pathname + '#l=' + code;
  try{ await navigator.clipboard.writeText(url); toast('Share link copied'); }
  catch{ openModal('Share link','Copy this URL', `<textarea class="exp" readonly>${esc(url)}</textarea>`); }
}
async function readShareFromHash(){
  const m = location.hash.match(/#l=(.+)$/);
  if(!m) return false;
  try{
    const ok = unpackList(await decodeShare(m[1]));
    if(ok){ history.replaceState(null,'',location.pathname); save(); toast('List loaded from link'); }
    return ok;
  }catch(e){ console.warn('bad share link', e); toast('Share link could not be read'); return false; }
}

/* ---- plain-text export ---- */
function exportText(){
  const lines = [];
  lines.push(listName);
  lines.push(`${armyPoints()} / ${pointsLimit} pts · ${EDITION}`);
  const dets = selectedDetachments.map(id => `${DATA.detachments[id].name} (${DATA.detachments[id].dp} DP)`);
  lines.push(`Detachments (${dpSpent()}/${DATA.dpBudget} DP): ` + (dets.join(', ') || 'none'));
  lines.push('');
  armyList.forEach(i => {
    const u = DATA.units[i.unitId]; if(!u) return;
    const ci = unitCopyIndex(i);
    lines.push(`${u.name}${i.models > 1 ? ' ×' + i.models : ''} — ${priceFor(u, i.models, ci)} pts${isEscalated(u,ci) ? ' (escalated)' : ''}`);
    const l = leaderInstOf(i);
    if(l) lines.push(`  Led by: ${DATA.units[l.unitId].name}`);
    if(i.enhancementId && DATA.enhancements[i.enhancementId]){
      const e = DATA.enhancements[i.enhancementId];
      lines.push(`  ${e.upgrade ? 'Upgrade' : 'Enhancement'}: ${e.name} (+${e.points||0} pts)`);
    }
    const ws = weaponSummaryText(u, i);
    if(ws) lines.push('  ' + ws);
  });
  return lines.join('\n');
}

/* --------------------------- shared card pieces --------------------------- */
function abilityPill(id, cls, label){
  const a = DATA.abilities[id];
  const name = label || (a ? a.name : id);
  return `<span class="pill tap ${cls||''}" data-ab="${esc(id)}">${esc(name)}</span>`;
}
function statBlock(stats, mods){
  const keys = [['m','M'],['t','T'],['sv','SV'],['w','W'],['ld','LD'],['oc','OC']];
  return `<div class="statline">${keys.map(([k,l]) =>
    `<div class="stat${mods && mods[k] ? ' mod' : ''}"><b>${l}</b><span>${esc(stats?.[k] ?? '–')}</span></div>`).join('')}</div>`;
}
function weaponRows(unit, inst, kind){
  const list = (unit.weapons?.[kind] || []).filter(w => weaponCount(inst, w) > 0);
  if(!list.length) return '';
  const inherited = inheritedAbilitiesFor(inst, kind);
  const ranged = kind === 'ranged';
  const head = ranged ? ['Range','A','BS','S','AP','D'] : ['','A','WS','S','AP','D'];
  let html = `<div class="sec"><div class="sec-t">${ranged?'Ranged':'Melee'} weapons</div>
    <table class="wtbl"><tr><th>Weapon</th>${head.map(h=>`<th>${h}</th>`).join('')}</tr>`;
  let lastGroup = null;
  list.forEach(w => {
    if(w.weaponGroup && w.weaponGroup !== lastGroup){
      html += `<tr><td colspan="7" class="wgrp">${esc(w.weaponGroupLabel || 'Choose one profile')}</td></tr>`;
      lastGroup = w.weaponGroup;
    }
    if(!w.weaponGroup) lastGroup = null;
    const n = weaponCount(inst, w);
    const abs = (w.abilities || []).map(a =>
      typeof a === 'string' ? abilityPill(a) : abilityPill(a.id, '', a.display));
    const inh = inherited.map(id => abilityPill(id, 'inh'));
    const all = abs.concat(inh);
    html += `<tr>
      <td><span class="wn">${n>1?n+'× ':''}${esc(w.name)}</span>${all.length?`<div class="wab">${all.join('')}</div>`:''}</td>
      <td>${esc(ranged ? (w.range||'–') : '')}</td><td>${esc(w.a??'–')}</td>
      <td>${esc((ranged ? w.bs : w.ws) ?? '–')}</td><td>${esc(w.s??'–')}</td>
      <td>${esc(w.ap??'–')}</td><td>${esc(w.d??'–')}</td></tr>`;
  });
  return html + '</table></div>';
}
function unitBody(unit, inst, opts){
  opts = opts || {};
  let h = '';
  const mods = unit._statMods;
  if(unit.modelProfiles?.length){
    h += unit.modelProfiles.map(p =>
      `<div class="prof-n">${esc(p.name)}${p.count?` ×${p.count}`:''}</div>${statBlock(p.stats, mods)}`).join('');
  } else if(unit.stats){
    h += statBlock(unit.stats, mods);
  }
  if(unit.invulnerableSave){
    h += `<div class="inv">🛡 <b>Invulnerable save ${esc(unit.invulnerableSave)}</b>` +
         (unit.invulnerableSource ? ` ${abilityPill(unit.invulnerableSource)}` : '') + `</div>`;
  }
  const granted = opts.noGrants ? [] : getDetachmentGrantedAbilities(unit);
  if(granted.length){
    h += `<div class="inv">✦ ${granted.map(g => abilityPill(g.id, 'grant', g.name)).join('')}</div>`;
  }
  if(unit.transportCapacity) h += `<div class="inv">🚚 Transport capacity ${esc(unit.transportCapacity)}</div>`;
  h += weaponRows(unit, inst, 'ranged');
  h += weaponRows(unit, inst, 'melee');

  const fac  = (unit.factionAbilities || []).map(id => abilityPill(id, 'fac'));
  const core = (unit.coreAbilities || []).map(id => abilityPill(id, 'core'));
  const abil = (unit.abilities || []).map(id => abilityPill(id));
  const wg   = (unit.wargear || []).map(id => abilityPill(id));
  if(inst?.exclusive) wg.push(abilityPill(inst.exclusive));
  Object.entries(inst?.wargear || {}).forEach(([id,on]) => { if(on) wg.push(abilityPill(id)); });
  if(fac.length || core.length || abil.length)
    h += `<div class="sec"><div class="sec-t">Abilities</div>${fac.join('')}${core.join('')}${abil.join('')}</div>`;
  if(wg.length) h += `<div class="sec"><div class="sec-t">Wargear</div>${wg.join('')}</div>`;

  // The datasheet's Leader block. Several units can share a name (the two
  // 'Ardmob Boyz), so list each name once, as the datasheet does.
  if(unit.canLead?.length && !opts.noLead){
    const names = [...new Set(unit.canLead.map(id => lookupUnit(id)?.name || id))];
    h += `<div class="sec"><div class="sec-t">Leader</div>
      <div class="muted" style="font-size:12.5px;margin-bottom:4px">This model can be attached to the following units:</div>
      ${names.map(n => `<span class="pill">${esc(n)}</span>`).join('')}</div>`;
  }

  const enh = inst?.enhancementId && DATA.enhancements[inst.enhancementId];
  if(enh){
    h += `<div class="sec"><div class="sec-t">${enh.upgrade?'Upgrade':'Enhancement'}</div>
      <span class="pill tap" data-enh="${esc(inst.enhancementId)}">★ ${esc(enh.name)} (${enh.points||0} pts)</span>
      ${(enh.grantsAbilities||[]).map(id => abilityPill(id,'grant')).join('')}</div>`;
  }
  if(unit.keywords?.length){
    h += `<div class="sec"><div class="sec-t">Keywords</div>${unit.keywords.map(k =>
      `<span class="pill kw">${esc(k)}</span>`).join('')}</div>`;
  }
  return h;
}

// Duplicate handling (guide §6): identical configs converge into one card;
// same-datasheet units with different configs get a short diff label.
function instanceSignature(i){
  return JSON.stringify([i.unitId, i.models, i.enhancementId,
    leaderInstOf(i)?.unitId || null, i.exclusive, i.wargear, i.weaponCounts, i.slots]);
}
function diffLabel(i){
  const u = DATA.units[i.unitId], bits = [];
  if(sizeOptions(u).length > 1) bits.push(i.models + ' models');
  const e = i.enhancementId && DATA.enhancements[i.enhancementId];
  if(e) bits.push(e.name);
  const l = leaderInstOf(i);
  if(l) bits.push('led by ' + DATA.units[l.unitId].name);
  if(i.exclusive && DATA.abilities[i.exclusive]) bits.push(DATA.abilities[i.exclusive].name);
  return bits.join(' · ');
}
function renderArmy(){
  const el = $('#view-army');
  if(!armyList.length){
    el.innerHTML = `<div class="empty">No units in the list.<br>Add some on the <strong>Builder</strong> tab.</div>`;
    return;
  }
  // leaders that are attached render inside their bodyguard's merged card
  const shown = armyList.filter(i => !isAttachedLeader(i));
  const groups = [];
  const bySig = {};
  shown.forEach(i => {
    const s = instanceSignature(i);
    if(bySig[s] != null){ groups[bySig[s]].n++; return; }
    bySig[s] = groups.length;
    groups.push({ inst:i, n:1 });
  });
  const multiConfig = {};
  shown.forEach(i => { multiConfig[i.unitId] = (multiConfig[i.unitId] || 0) + 1; });

  el.innerHTML = groups.map(g => {
    const i = g.inst, u = DATA.units[i.unitId];
    const l = leaderInstOf(i), lu = l && DATA.units[l.unitId];
    const label = multiConfig[i.unitId] > 1 ? diffLabel(i) : '';
    const ci = unitCopyIndex(i);
    // An Attached unit is one card, so it shows one combined cost (guide §5.1).
    const pts = instancePoints(i) + (l ? instancePoints(l) : 0);
    const sub = [u.modelBreakdown || (i.models > 1 ? i.models + ' models' : ''), label,
                 l ? `${instancePoints(i)} + ${instancePoints(l)} pts` : ''].filter(Boolean).join(' · ');
    const ck = 'a:' + i.uid;
    return `<div class="unit${collapseClass(ck)}">
      <div class="unit-hd" data-ucol="${ck}">
        <h3>${esc(u.name)}${g.n>1?` <span class="muted">×${g.n}</span>`:''}
          <span class="sub">${esc(sub)}</span></h3>
        <span class="pts">${pts}${isEscalated(u,ci)?' <span class="esc" title="Escalated cost — copy #'+ci+'">↑</span>':''}</span>
        ${collapseChevron()}
      </div>
      ${lu ? `<div class="leader-band">Leader — ${esc(lu.name)}</div><div class="unit-bd">${unitBody(lu, l, {noLead:true})}</div>
              <div class="leader-band merged-sec">Unit — ${esc(u.name)}</div>` : ''}
      <div class="unit-bd">${unitBody(u, i)}</div>
    </div>`;
  }).join('');
}

/* A separate, introductory game mode: one fixed force, its own datasheets and
   its own stratagems. No list building, no wargear choices, no points, no
   detachments — so this view is read-only by design. */
// ---- Combat Patrol force choices -------------------------------------------
const cpEnhancements = () => Object.entries(DATA.combatPatrol?.enhancements || {}).map(([id,e]) => ({id, ...e}));
const cpActiveEnh = () => {
  const e = DATA.combatPatrol?.enhancements?.[cpChoice.enh];
  return e ? { id: cpChoice.enh, ...e } : null;
};
const cpLeaders = () => (DATA.combatPatrol?.leaderChoice?.leaders || []);
// Roster entries the chosen leader is allowed to attach to.
function cpLeaderTargets(leaderId){
  const lu = DATA.cpUnits[leaderId];
  if(!lu) return [];
  return cpRosterEntries().map((e,i) => ({...e, idx:i}))
    .filter(e => e.unit !== leaderId && (lu.canLead || []).includes(e.unit));
}
// Roster with the chosen leader folded into its target entry and removed from
// its own slot, so an attached leader is never shown twice.
function cpLayout(){
  const entries = cpRosterEntries().map((e,i) => ({...e, idx:i}));
  const { leader, target } = cpChoice;
  if(leader == null || target == null) return entries;
  const tgt = entries.find(e => e.idx === target);
  if(!tgt || !cpLeaderTargets(leader).some(e => e.idx === target)) return entries;
  tgt.ledBy = leader;
  return entries.filter(e => !(e.unit === leader && e.idx !== target));
}
// Apply the active enhancement's effects to a unit's displayed profile,
// recording which stats changed so they can be highlighted.
function cpDisplayUnit(u){
  const e = cpActiveEnh();
  if(!u || !e?.effects || !(e.restrictedTo || []).includes(u.id)) return u;
  const d = {...u, _statMods:{}};
  if(e.effects.sv){
    d._statMods.sv = true;
    if(d.stats) d.stats = {...d.stats, sv:e.effects.sv};
    if(d.modelProfiles) d.modelProfiles = d.modelProfiles.map(p => ({...p, stats:{...p.stats, sv:e.effects.sv}}));
  }
  if(e.effects.invulnerableSave){
    d.invulnerableSave = e.effects.invulnerableSave;
    d.invulnerableSource = null;
  }
  return d;
}
const cpEnhFor = unitId => {
  const e = cpActiveEnh();
  return (e && (e.restrictedTo || []).includes(unitId)) ? e : null;
};
function cpEnhBadge(unitId){
  const e = cpEnhFor(unitId);
  if(!e) return '';
  return `<div class="sec"><div class="sec-t">${e.upgrade ? 'Upgrade' : 'Enhancement'}</div>
    <span class="pill tap star" data-cpenhinfo="${esc(e.id)}">★ ${esc(e.name)}</span></div>`;
}

function renderCombatPatrol(){
  const el = $('#view-cp'), cp = DATA.combatPatrol;
  if(!cp){
    el.innerHTML = `<div class="empty">No Combat Patrol data yet.<br>

  const models = cpRosterEntries().reduce((n,e) => n + (DATA.cpUnits[e.unit]?.models || 0) * e.count, 0);
  const strats = Object.entries(cp.stratagems || {}).map(([id,s]) => ({id, ...s}));

  const rules = [].concat(cp.rule || cp.rules || []).filter(Boolean);
  const det = cp.detachment;
  const detBody = det ? `<div class="dcard" style="cursor:default">
      <div class="bar" style="background:${esc(DATA.detCategories[det.category] || 'var(--dim)')}"></div>
      <div class="in"><div class="n">${esc(det.name)}</div>
      <div class="m">${det.dp != null ? det.dp + ' DP · ' : ''}${esc(det.category || '')}</div></div></div>
    <p style="margin:9px 0 0">${det.ruleDescription || '<em>Rule to be added.</em>'}</p>` : '';
  const rulesBody = detBody + rules.map(r =>
    `<p><strong>${esc(r.name || '')}</strong><br>${r.description || '<em>Rule to be added.</em>'}</p>`).join('');
  const rulesPanel = (det || rules.length) ? panel('cpRule', 'Detachment & rules',
    esc([det?.name, ...rules.map(r => r.name)].filter(Boolean).join(', ')),
    rulesBody, ui.panels.cpRule) : '';

  // --- force choices: one enhancement, one attached leader
  const enhs = cpEnhancements(), leaders = cpLeaders();
  const active = cpActiveEnh();
  const targets = cpChoice.leader ? cpLeaderTargets(cpChoice.leader) : [];
  const choiceBits = [];
  if(enhs.length){
    const limit = cp.enhancementLimit ?? 1;
    choiceBits.push(`<div class="ctl"><label>Enhancement</label>
      <select class="sel grow" id="cpEnhSel">
        <option value="">— none —</option>
        ${enhs.map(e => `<option value="${esc(e.id)}" ${cpChoice.enh===e.id?'selected':''}>${esc(e.name)}${e.upgrade?' [Upgrade]':''}</option>`).join('')}
      </select></div>
      <div class="muted" style="font-size:11.5px;margin-top:4px">${active
        ? `Goes on: ${esc(active.restriction || '—')}`
        : `Pick ${limit === 1 ? 'one' : 'up to ' + limit}. ${esc(enhs.map(e => e.name).join(' or '))}.`}</div>`);
  }
  if(leaders.length){
    choiceBits.push(`<div class="ctl" style="margin-top:10px"><label>Leader</label>
      <select class="sel grow" id="cpLeadSel">
        <option value="">— none attached —</option>
        ${leaders.map(id => `<option value="${esc(id)}" ${cpChoice.leader===id?'selected':''}>${esc(DATA.cpUnits[id]?.name || id)}</option>`).join('')}
      </select></div>
      ${cpChoice.leader ? `<div class="ctl"><label>Attach to</label>
        <select class="sel grow" id="cpTgtSel">
          <option value="">— not attached —</option>
          ${targets.map(e => `<option value="${e.idx}" ${cpChoice.target===e.idx?'selected':''}>${esc(DATA.cpUnits[e.unit]?.name || e.unit)}${e.note?' — '+esc(e.note):''}</option>`).join('')}
        </select></div>` : ''}
      <div class="muted" style="font-size:11.5px;margin-top:4px">${esc(cp.leaderChoice?.prompt || '')}</div>`);
  }
  const choiceSummary = [
    active ? active.name : null,
    cpChoice.leader && cpChoice.target != null ? (DATA.cpUnits[cpChoice.leader]?.name + ' attached') : null
  ].filter(Boolean).join(' · ') || '<span class="muted">nothing selected</span>';
  const choicePanel = choiceBits.length
    ? panel('cpChoice', 'Force choices', choiceSummary, choiceBits.join(''), ui.panels.cpChoice)
    : '';

  const stratPanel = strats.length ? panel('cpStrat', 'Combat Patrol stratagems',
    `<span class="tag">${strats.length}</span>`,
    strats.map(stratCard).join(''), ui.panels.cpStrat) : '';

  el.innerHTML = `
    <div class="panel open"><div class="panel-bd">
      <div class="totals">
        <span class="big">${entries.reduce((n,e) => n + e.count, 0)}</span>
        <span class="muted">units${models ? ` · ${models} models` : ''}</span>
        <span class="grow"></span>
        <span class="muted" style="font-size:12px">${esc(cp.name || 'Combat Patrol')}</span>
      </div>
      ${cp.notes ? `<p class="muted" style="font-size:12.5px;margin:8px 0 0">${cp.notes}</p>` : ''}
    </div></div>
    ${rulesPanel}${choicePanel}${stratPanel}
    ${entries.length ? entries.map(cpCard).join('')
      : `<div class="empty">No units in the Combat Patrol roster yet.<br>
         Add them to the <code>roster</code> array in <code>data/combat-patrol/index.json</code>.</div>`}`;
}

/* ------------------------- FACTION CALL DOCK ------------------------------ */
/* An always-on-screen button for the faction's once-per-battle call, with an
   ongoing banner naming the effect while it is active. Entirely data-driven:
   it renders only if the ability below exists AND carries the call* keys, so
   another faction just needs a different id and its own data. */
const FACTION_CALL_ID = 'waaagh';
// Which tabs the call button appears on. Add 'army' here to surface it there too.
const FACTION_CALL_TABS = ['cp'];
const factionCall = () => {
  const a = DATA.abilities[FACTION_CALL_ID];
  return (a && a.callEffect) ? a : null;
};
function renderDock(){
  const a = factionCall(), dock = $('#dock');
  if(!a || !FACTION_CALL_TABS.includes(ui.tab)){
    dock.style.display = 'none';
    document.body.style.setProperty('--dock-h','0px');
    return;
  }
  dock.style.display = '';
  const btn = $('#dockBtn'), ban = $('#dockBanner'), on = !!game.waaagh;

  btn.textContent = a.name.toUpperCase();
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', String(on));
  btn.title = on ? (a.callDuration || '') : (a.callWhen || '');

  ban.classList.toggle('on', on);
  if(on){
    ban.innerHTML = `<div class="hd"><b>${esc(a.callLabel || a.name.toUpperCase())}</b>
        <button id="dockEnd">End</button></div>
      <div>${a.callEffect}</div>
      ${a.callDuration ? `<span class="dur">${esc(a.callDuration)}</span>` : ''}`;
  } else {
    ban.innerHTML = '';
  }
  // Keep page content clear of the dock, whatever height it currently is.
  // Measure now so there is no frame where content sits underneath, then again
  // after layout settles (the banner animates in).
  const setH = () => document.body.style.setProperty('--dock-h', dock.offsetHeight + 'px');
  setH();
  requestAnimationFrame(setH);
}
function fireDock(){
  const btn = $('#dockBtn'), flash = $('#dockFlash');
  btn.classList.remove('fire'); flash.classList.remove('on');
  void btn.offsetWidth;                       // restart the animations
  btn.classList.add('fire'); flash.classList.add('on');
  if(navigator.vibrate) { try { navigator.vibrate([18, 40, 28]); } catch {} }
  setTimeout(() => { btn.classList.remove('fire'); flash.classList.remove('on'); }, 800);
}
function callFaction(){
  fireDock();
  if(game.waaagh) return;                     // already called — just roar again
  game.waaagh = true;
  save();
  setTimeout(() => { renderDock(); renderPoints(); }, 260);   // effect first, then the banner
}
function endFactionCall(){
  game.waaagh = false;
  save(); renderDock(); renderPoints();
}

/* --------------------------------- POINTS --------------------------------- */
function renderPoints(){
  const t = (key,label,sub,val,extra='') => `<div class="track">
    <div class="lbl"><b>${label}</b><small>${sub}</small></div>
    <button data-g="${key}:-1">−</button><div class="val">${val}</div><button data-g="${key}:1">+</button>${extra}</div>`;
  $('#view-points').innerHTML =
    t('cp','Command Points','Spent on stratagems', game.cp) +
    t('round','Battle round','1–5', game.round) +
    t('vpUs','Your VP','Victory points scored', game.vpUs) +
    t('vpThem','Opponent VP','Victory points scored', game.vpThem) +
    `<div class="track"><div class="lbl"><b>WAAAGH!</b><small>Once per battle</small></div>
      <button class="btn ${game.waaagh?'pri':''}" id="btnWaaagh" style="width:auto;padding:8px 14px;font-size:14px">${game.waaagh?'CALLED':'Call it'}</button></div>
    <div class="panel open"><div class="panel-bd row">
      <span class="muted grow" style="font-size:12px">${armyPoints()} / ${pointsLimit} pts · ${dpSpent()}/${DATA.dpBudget} DP</span>
      <button class="btn mini" id="btnResetGame">Reset game state</button>
    </div></div>`;
}

/* ================================ EVENTS ================================= */
document.addEventListener('click', e => {
  const el = t => e.target.closest(t);

  // tabs
  const tab = el('nav button');
  if(tab){ setTab(tab.dataset.tab); return; }
  // collapsible panels
  const ph = el('.panel-hd');
  if(ph){
    const id = ph.dataset.panel;
    if(id === 'pDet') ui.detOpen = !ui.detOpen;
    else if(id === 'pEnh') ui.enhOpen = !ui.enhOpen;
    else ui.panels[id] = !ui.panels[id];
    renderBuilder(); renderCombatPatrol(); return;
  }
  // ability / enhancement popups
  const ab = el('[data-ab]');
  if(ab){
    const a = DATA.abilities[ab.dataset.ab];
    if(a) openModal(a.name, a.type || '', a.description || '<em>Rule to be added.</em>',
      a.needsVerification ? 'Seeded text — not yet verified against your 11th-ed source.' : null);
    else openModal(ab.dataset.ab, 'Unknown ability', '<em>Not found in data/abilities.json.</em>');
    return;
  }
  const en = el('[data-enh]');
  if(en){
    const x = DATA.enhancements[en.dataset.enh];
    if(x) openModal(x.name, x.type || (x.upgrade?'Upgrade':'Enhancement'),
      `<p class="muted">Goes on: ${esc(x.restriction || (x.upgrade?'any non-Epic-Hero unit':'CHARACTER model'))} · ${x.points||0} pts</p>` +
      (x.description || '<em>Rule to be added.</em>'));
    return;
  }
  const ce = el('[data-cpenhinfo]');
  if(ce){
    const x = DATA.combatPatrol?.enhancements?.[ce.dataset.cpenhinfo];
    if(x) openModal(x.name, x.type || (x.upgrade ? 'Upgrade' : 'Enhancement'),
      `<p class="muted">Goes on: ${esc(x.restriction || '—')}</p>` + (x.description || '<em>Rule to be added.</em>'));
    return;
  }

  // collapse / expand a unit card
  const uc = el('[data-ucol]');
  if(uc){ toggleCollapse(uc.dataset.ucol, uc.closest('.unit')); return; }

  // detachments
  const dc = el('[data-det]');
  if(dc){ toggleDetachment(dc.dataset.det); return; }
  if(el('#btnRules')){ showDetachmentRules(); return; }
  if(el('#btnDp')){ ui.detOpen = true; renderBuilder(); showDetachmentRules(); return; }

  // builder controls
  const sz = el('[data-size]');
  if(sz){
    const [u,dir] = sz.dataset.size.split(':');
    const inst = armyList.find(i => i.uid === u), unit = DATA.units[inst.unitId];
    const sizes = sizeOptions(unit), at = sizes.indexOf(inst.models);
    const next = sizes[Math.min(Math.max((at < 0 ? 0 : at) + (+dir), 0), sizes.length - 1)];
    if(next != null && next !== inst.models){ inst.models = next; save(); renderAll(); }
    return;
  }
  const dup = el('[data-dup]'); if(dup){ duplicateInstance(dup.dataset.dup); return; }
  const del = el('[data-del]'); if(del){ removeInstance(del.dataset.del); return; }

  // stratagem filters
  const ch = el('[data-phase]'); if(ch){ ui.stratPhase = ch.dataset.phase; renderStrats(); return; }
  const ct = el('[data-turn]');  if(ct){ ui.stratTurn  = ct.dataset.turn;  renderStrats(); return; }

  // game trackers
  const g = el('[data-g]');
  if(g){
    const [k,d] = g.dataset.g.split(':');
    game[k] = Math.max(0, (game[k]||0) + (+d));
    if(k === 'round') game[k] = Math.min(5, Math.max(1, game[k]));
    save(); renderPoints(); return;
  }
  if(el('#dockEnd')){ endFactionCall(); return; }
  if(el('#dockBtn')){ callFaction(); return; }
  if(el('#btnWaaagh')){ game.waaagh = !game.waaagh; save(); renderPoints(); renderDock(); return; }
  if(el('#btnResetGame')){ game = {cp:0, round:1, vpUs:0, vpThem:0, waaagh:false}; save(); renderPoints(); renderDock(); return; }

  // header
  if(el('#btnTheme')){
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? '' : 'light';
    if(cur) document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');
    localStorage.setItem(LS.theme, cur); return;
  }
  if(el('#btnMenu')){ showMenu(); return; }
});

document.addEventListener('change', e => {
  const t = e.target;
  const find = u => armyList.find(i => i.uid === u);

  if(t.id === 'cpEnhSel'){ cpChoice.enh = t.value || null; save(); renderCombatPatrol(); return; }
  if(t.id === 'cpLeadSel'){
    cpChoice.leader = t.value || null;
    // Default to the only legal target when there is exactly one; otherwise clear.
    const tg = cpChoice.leader ? cpLeaderTargets(cpChoice.leader) : [];
    cpChoice.target = tg.length === 1 ? tg[0].idx : null;
    save(); renderCombatPatrol(); return;
  }
  if(t.id === 'cpTgtSel'){ cpChoice.target = t.value === '' ? null : +t.value; save(); renderCombatPatrol(); return; }

  if(t.id === 'addSel' && t.value){ addUnit(t.value); return; }
  if(t.id === 'limitIn'){ pointsLimit = parseInt(t.value,10) || 0; save(); renderBuilder(); return; }

  if(t.dataset.excl){ const i = find(t.dataset.excl); i.exclusive = t.value || null; save(); renderAll(); return; }
  if(t.dataset.leader){ const i = find(t.dataset.leader); i.leaderId = t.value || null; save(); renderAll(); return; }
  if(t.dataset.enhsel){
    const i = find(t.dataset.enhsel);
    i.enhancementId = t.value || null;
    save(); renderAll(); return;
  }
  if(t.dataset.wg){
    const [u,id] = t.dataset.wg.split(':');
    const i = find(u); i.wargear[id] = t.checked; save(); renderAll(); return;
  }
  if(t.dataset.wpn){
    const idx = t.dataset.wpn.indexOf(':');
    const u = t.dataset.wpn.slice(0, idx), name = t.dataset.wpn.slice(idx+1);
    const i = find(u), unit = DATA.units[i.unitId];
    const w = ['ranged','melee'].flatMap(k => unit.weapons?.[k]||[]).find(x => x.name === name);
    i.weaponCounts[name] = t.checked ? Math.max(1, w?.count ?? 1) : 0;
    save(); renderAll(); return;
  }
});

/* --------------------------------- menu --------------------------------- */
function showMenu(){
  const lists = getLists();
  openModal('Lists & sharing', listName, `
    <p><button class="btn" id="mSave">Save list…</button>
       <button class="btn" id="mShare">Share link</button>
       <button class="btn" id="mExport">Text export</button></p>
    <p><button class="btn" id="mTracker">In-game tracker</button>
       <span class="muted" style="font-size:12px">CP · battle round · VP · WAAAGH!</span></p>
    <p><button class="btn danger" id="mClear">Clear army list</button></p>
    <div class="sec-t" style="margin-top:12px">Saved lists</div>
    ${lists.length ? lists.map(l => `<p class="row">
      <span class="grow">${esc(l.name)} <span class="muted" style="font-size:12px">· ${(l.army||[]).length} units</span></span>
      <button class="btn mini" data-loadlist="${esc(l.name)}">Load</button>
      <button class="btn mini danger" data-dellist="${esc(l.name)}">✕</button></p>`).join('')
      : '<p class="muted">No saved lists yet.</p>'}`);

  $('#mSave').onclick = () => {
    const n = prompt('Name this list:', listName);
    if(n) { saveListSlot(n.trim()); $('#modal').classList.remove('on'); renderAll(); }
  };
  $('#mShare').onclick = () => shareLink();
  $('#mTracker').onclick = () => { setTab('points'); $('#modal').classList.remove('on'); };
  $('#mExport').onclick = () => openModal('Text export', listName,
    `<textarea class="exp" readonly>${esc(exportText())}</textarea>`);
  $('#mClear').onclick = () => {
    if(confirm('Remove every unit from the current list?')){
      armyList = []; save(); renderAll(); $('#modal').classList.remove('on');
    }
  };
  $('#mBody').querySelectorAll('[data-loadlist]').forEach(b =>
    b.onclick = () => { loadListSlot(b.dataset.loadlist); $('#modal').classList.remove('on'); });
  $('#mBody').querySelectorAll('[data-dellist]').forEach(b =>
    b.onclick = () => { putLists(getLists().filter(x => x.name !== b.dataset.dellist)); showMenu(); });
}

/* --------------------------------- boot --------------------------------- */
(async function boot(){
  $('#verLine').textContent = `${EDITION} — Version ${VERSION}`;
  try{
    await loadData();
  }catch(err){
    console.error(err);
    $('#loadErr').innerHTML = `<div class="err"><strong>Couldn't load data.</strong><br>${esc(err.message)}<br><br>
      If you opened this file directly, serve it over HTTP instead — <code>python3 -m http.server</code> — browsers block <code>fetch</code> on <code>file://</code>.</div>`;
  }
  loadState();
  validateCpChoice();
  await readShareFromHash();
  renderAll();
})();
</script>
